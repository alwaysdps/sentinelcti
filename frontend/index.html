<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SentinelCTI — a defensive cyber threat intelligence platform for safely triaging suspicious files, URLs and network indicators."
    />

    <!--
      Canonical host. This deployment is reachable on several *.vercel.app
      names, all serving identical content; without this a search engine has to
      guess which is the original and may pick a different one each time. The
      real fix is deleting the duplicate projects — this only limits the damage
      until then.

      Change this and sitemap.xml together if a custom domain is added.
    -->
    <link rel="canonical" href="https://sentinelcti.vercel.app/" />

    <!--
      Google Search Console, verified by meta tag rather than the uploaded HTML
      file: the SPA fallback rewrite answers unknown paths with index.html, so
      /google<token>.html would return the app shell and verification would
      fail with no obvious cause.

      Not a secret -- it is public in the page source by design, and proves
      only that whoever added it can edit this site. Removing it un-verifies
      the property, so it stays as long as Search Console is in use.
    -->
    <meta
      name="google-site-verification"
      content="UHJwq8Wqc8NCa5y2yYv4DJrZTJ_lVxItAePDspdfjj8"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SentinelCTI" />
    <meta property="og:url" content="https://sentinelcti.vercel.app/" />
    <meta property="og:title" content="SentinelCTI — Threat Intelligence Platform" />
    <meta
      property="og:description"
      content="Triage suspicious files, URLs, domains, IPs and hashes on infrastructure you control — with every point of the verdict explained."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#070b0a" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%232ee6a6' d='M16 2 4 7v9c0 7.2 5.1 13.9 12 15.5C22.9 29.9 28 23.2 28 16V7L16 2Zm0 3.3 9 3.7v7c0 5.7-3.8 11-9 12.5C10.8 27 7 21.7 7 16V9l9-3.7Z'/%3E%3Cpath fill='%232ee6a6' d='M14.6 19.4 11 15.8l1.8-1.8 1.8 1.8 4.6-4.6 1.8 1.8-6.4 6.4Z'/%3E%3C/svg%3E"
    />
    <title>SentinelCTI — Threat Intelligence Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
